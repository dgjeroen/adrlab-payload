name: Manual - Clone Development Branch from Main

on:
  workflow_dispatch: # Manual trigger only

jobs:
  clone-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Get production branch ID
        id: get-main-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "🔍 Starting branch ID lookup..."
          echo "Project ID: ${{ vars.NEON_PROJECT_ID }}"
          echo "API Key length: ${#NEON_API_KEY}"

          # Test if API key is set
          if [ -z "$NEON_API_KEY" ]; then
            echo "❌ ERROR: NEON_API_KEY secret is empty or not set!"
            exit 1
          fi

          echo "Fetching production branch ID from Neon..."

          # Make API call - redirect stderr to file for debugging
          set +e
          curl -w "\nHTTP_CODE:%{http_code}" -o /tmp/response.json \
            -X GET "https://api.neon.tech/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" 2>/tmp/curl_stderr.log

          CURL_EXIT=$?
          set -e

          echo "Curl exit code: $CURL_EXIT"

          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ Curl command failed with exit code $CURL_EXIT"
            echo "Curl error output:"
            cat /tmp/curl_stderr.log 2>/dev/null || echo "No error log"
            exit 1
          fi

          # Extract HTTP code from response
          HTTP_CODE=$(tail -1 /tmp/response.json | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          echo "HTTP status code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API returned HTTP $HTTP_CODE"
            echo "Response body:"
            head -n -1 /tmp/response.json
            exit 1
          fi

          # Remove the HTTP_CODE line from response
          head -n -1 /tmp/response.json > /tmp/response_clean.json
          BRANCHES=$(cat /tmp/response_clean.json)
          echo "API Response (first 500 chars):"
          echo "$BRANCHES" | head -c 500
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API returned HTTP $HTTP_CODE"
            echo "Full response: $BRANCHES"
            exit 1
          fi

          MAIN_BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "production") | .id' 2>/dev/null | head -1)

          if [ -z "$MAIN_BRANCH_ID" ] || [ "$MAIN_BRANCH_ID" == "null" ]; then
            echo "❌ Error: Could not find production branch"
            echo "Available branches:"
            echo "$BRANCHES" | jq -r '.branches[].name' 2>/dev/null || echo "Failed to parse branches"
            exit 1
          fi

          echo "main_branch_id=$MAIN_BRANCH_ID" >> $GITHUB_OUTPUT
          echo "✅ Production branch ID found: $MAIN_BRANCH_ID"

      - name: Delete old development branch (if exists)
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Attempting to delete old development branch..."
          curl -s -X DELETE "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches/development" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -w "\nStatus: %{http_code}\n"
          echo "✓ Old branch deletion attempted"

      - name: Create new development branch from production
        id: create-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Creating new development branch as copy of production..."
          RESPONSE=$(curl -s -X POST "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "development",
                "parent_id": "${{ steps.get-main-branch.outputs.main_branch_id }}"
              }
            }')

          echo "Neon API response: $RESPONSE"

          CONNECTION_STRING=$(echo "$RESPONSE" | jq -r '.branch.connection_strings.postgres[0]' 2>/dev/null)

          if [ -z "$CONNECTION_STRING" ] || [ "$CONNECTION_STRING" == "null" ]; then
            echo "Error: Could not extract connection string"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "✓ Development branch created!"
          echo "Connection string: ${CONNECTION_STRING:0:50}..."

      - name: Show connection string
        run: |
          echo "📋 Your new development branch DATABASE_URL:"
          echo "${{ steps.create-branch.outputs.connection_string }}"
          echo ""
          echo "✅ Development branch ready! Update your .env.local with this connection string."
