name: Sync Development Database (Daily)

on:
  schedule:
    # Run every day at 4:05 AM UTC (after Neon's auto-delete at 3:59 AM)
    - cron: "5 4 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete old development branch (if exists)
        continue-on-error: true
        run: |
          echo "Attempting to delete old development branch..."
          curl -s -X DELETE "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches/development" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -w "\nStatus: %{http_code}\n"
          echo "✓ Old branch cleanup attempted (may have already been deleted by Neon auto-delete)"

      - name: Get main branch ID
        id: get-main-branch
        run: |
          echo "Fetching main branch ID from Neon..."
          BRANCHES=$(curl -s -X GET "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}")

          echo "Branches response: $BRANCHES"

          MAIN_BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "main") | .id' 2>/dev/null | head -1)

          if [ -z "$MAIN_BRANCH_ID" ] || [ "$MAIN_BRANCH_ID" == "null" ]; then
            echo "Error: Could not find main branch ID"
            exit 1
          fi

          echo "main_branch_id=$MAIN_BRANCH_ID" >> $GITHUB_OUTPUT
          echo "✓ Main branch ID found: $MAIN_BRANCH_ID"

      - name: Create new development branch from main
        id: create-branch
        run: |
          echo "Creating new development branch as copy of main..."
          RESPONSE=$(curl -s -X POST "https://api.neon.tech/v1/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "development",
                "parent_id": "${{ steps.get-main-branch.outputs.main_branch_id }}"
              }
            }')

          echo "Neon API response: $RESPONSE"

          # Extract connection string using jq for proper JSON parsing
          CONNECTION_STRING=$(echo "$RESPONSE" | jq -r '.branch.connection_strings.postgres[0]' 2>/dev/null)

          if [ -z "$CONNECTION_STRING" ] || [ "$CONNECTION_STRING" == "null" ]; then
            echo "Error: Could not extract connection string from response"
            echo "Full response was: $RESPONSE"
            exit 1
          fi

          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "✓ New development branch created successfully"
          echo "Connection string extracted: ${CONNECTION_STRING:0:30}..."

      - name: Update Vercel environment variable (DATABASE_URL)
        run: |
          echo "Updating Vercel DATABASE_URL..."

          # Get all environment variables first
          ENV_RESPONSE=$(curl -s -X GET "https://api.vercel.com/v9/projects/${{ vars.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}")

          echo "Current env vars: $ENV_RESPONSE"

          # Update DATABASE_URL
          curl -s -X PATCH "https://api.vercel.com/v9/projects/${{ vars.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "key": "DATABASE_URL",
              "value": "${{ steps.create-branch.outputs.connection_string }}",
              "target": ["preview", "production"]
            }]' \
            -w "\nStatus: %{http_code}\n"

      - name: Trigger Vercel redeploy
        run: |
          echo "Triggering Vercel redeploy..."
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectId\": \"${{ vars.VERCEL_PROJECT_ID }}\",
              \"source\": \"github\"
            }" \
            -w "\nStatus: %{http_code}\n" || echo "Redeploy request sent (may be processed asynchronously)"

      - name: Notify completion
        if: success()
        run: |
          echo "✅ Development database sync completed successfully!"
          echo "- New development branch created from main (old one auto-deleted by Neon)"
          echo "- Vercel env vars updated"
          echo "- Redeploy triggered"
