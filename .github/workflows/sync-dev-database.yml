name: Sync Development Database (Daily)

on:
  schedule:
    # Run every day at 4:05 AM UTC
    - cron: "5 4 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Check if development branch exists
        id: check-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Checking if development branch exists..."

          BRANCHES=$(curl -s "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          DEV_BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "development") | .id')

          if [ ! -z "$DEV_BRANCH_ID" ]; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
            echo "branch_id=$DEV_BRANCH_ID" >> $GITHUB_OUTPUT
            echo "✓ Development branch exists: $DEV_BRANCH_ID"
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
            echo "⚠ No development branch found, will create new one"
          fi

      - name: Get production branch ID
        id: get-main-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Fetching production branch ID from Neon..."
          BRANCHES=$(curl -s -X GET "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          echo "Branches response: $BRANCHES"

          MAIN_BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "production") | .id' 2>/dev/null | head -1)

          if [ -z "$MAIN_BRANCH_ID" ] || [ "$MAIN_BRANCH_ID" == "null" ]; then
            echo "Error: Could not find production branch ID"
            exit 1
          fi

          echo "main_branch_id=$MAIN_BRANCH_ID" >> $GITHUB_OUTPUT
          echo "✓ Production branch ID found: $MAIN_BRANCH_ID"

      - name: Restore development branch from production
        if: steps.check-branch.outputs.branch_exists == 'true'
        id: restore-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "🔄 Restoring development branch from production..."
          echo "This resets the development branch to match production data"

          # Use Neon's restore endpoint to reset development branch to production state
          RESPONSE=$(curl -s -X POST "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.check-branch.outputs.branch_id }}/restore" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"source_branch_id\": \"${{ steps.get-main-branch.outputs.main_branch_id }}\"
            }")

          echo "Restore response: $RESPONSE"

          # Get new branch ID after restore
          NEW_BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branch.id')

          # Check if restore was successful
          if [ ! -z "$NEW_BRANCH_ID" ] && [ "$NEW_BRANCH_ID" != "null" ]; then
            echo "new_branch_id=$NEW_BRANCH_ID" >> $GITHUB_OUTPUT
            echo "✅ Development branch restored! New ID: $NEW_BRANCH_ID"
          else
            echo "⚠️ Restore may have failed, check response above"
            echo "Falling back to recreation..."
            exit 1
          fi

      - name: Ensure endpoint exists after restore
        if: steps.check-branch.outputs.branch_exists == 'true'
        id: ensure-endpoint
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          BRANCH_ID="${{ steps.restore-branch.outputs.new_branch_id }}"
          echo "Checking if branch $BRANCH_ID has an endpoint..."

          # Get all endpoints for the project
          ENDPOINTS_RESPONSE=$(curl -s "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/endpoints" \
            -H "Authorization: Bearer $NEON_API_KEY")

          echo "Endpoints response: $ENDPOINTS_RESPONSE"

          # Check if an endpoint exists for this branch
          EXISTING_ENDPOINT=$(echo "$ENDPOINTS_RESPONSE" | jq -r ".endpoints[] | select(.branch_id == \"$BRANCH_ID\") | .id" | head -1)

          if [ -z "$EXISTING_ENDPOINT" ] || [ "$EXISTING_ENDPOINT" == "null" ]; then
            echo "⚠️ No endpoint found - creating one..."
            
            # Create endpoint
            ENDPOINT_RESPONSE=$(curl -s -X POST "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/endpoints" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"endpoint\": {
                  \"branch_id\": \"$BRANCH_ID\",
                  \"type\": \"read_write\"
                }
              }")
            
            echo "Endpoint creation response: $ENDPOINT_RESPONSE"
            
            # Wait for endpoint to be ready
            echo "Waiting 10 seconds for endpoint to initialize..."
            sleep 10
            
            ENDPOINT_ID=$(echo "$ENDPOINT_RESPONSE" | jq -r '.endpoint.id')
          else
            echo "✅ Endpoint already exists: $EXISTING_ENDPOINT"
            ENDPOINT_ID="$EXISTING_ENDPOINT"
          fi

          # Get endpoint details to retrieve connection string
          ENDPOINT_DETAILS=$(curl -s "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/endpoints/$ENDPOINT_ID" \
            -H "Authorization: Bearer $NEON_API_KEY")

          CONNECTION_STRING=$(echo "$ENDPOINT_DETAILS" | jq -r '.endpoint.connection_uris[0].connection_uri // empty')

          if [ -z "$CONNECTION_STRING" ]; then
            echo "❌ Failed to get connection string from endpoint"
            exit 1
          fi

          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "✅ Connection string: ${CONNECTION_STRING:0:50}..."

      - name: Create new development branch from production
        if: steps.check-branch.outputs.branch_exists == 'false'
        id: create-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Creating new development branch as copy of production..."
          RESPONSE=$(curl -s -X POST "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "development",
                "parent_id": "${{ steps.get-main-branch.outputs.main_branch_id }}"
              },
              "endpoints": [
                {
                  "type": "read_write"
                }
              ]
            }')

          echo "Neon API response: $RESPONSE"

          BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branch.id')
          echo "Branch ID: $BRANCH_ID"

          CONNECTION_STRING=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_uri' 2>/dev/null)

          if [ -z "$CONNECTION_STRING" ] || [ "$CONNECTION_STRING" == "null" ]; then
            echo "❌ Error: Could not extract connection string from response"
            echo "Full response was: $RESPONSE"
            exit 1
          fi

          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "✅ New development branch created with endpoint!"
          echo "Connection string extracted: ${CONNECTION_STRING:0:50}..."
          echo "⚠️ NOTE: You need to update DATABASE_URL in your local .env file with this connection string"

      - name: Notify completion (restore)
        if: steps.check-branch.outputs.branch_exists == 'true'
        run: |
          echo "✅ Development database sync completed successfully!"
          echo "- Development branch restored from production"
          echo "- All data synchronized"
          echo "- Endpoint ensured: ${{ steps.ensure-endpoint.outputs.connection_string }}"
          echo ""
          echo "⚠️ IMPORTANT: If connection string changed, update your local .env:"
          echo "DATABASE_URL=${{ steps.ensure-endpoint.outputs.connection_string }}"

      - name: Notify completion (new branch)
        if: steps.check-branch.outputs.branch_exists == 'false'
        run: |
          echo "✅ Development database created successfully!"
          echo "- New development branch created from production"
          echo "- ⚠️ IMPORTANT: Update DATABASE_URL in your local .env file"
          echo "- Connection string: ${{ steps.create-branch.outputs.connection_string }}"
