name: Sync Development Database (Daily)

on:
  schedule:
    # Run every day at 4:05 AM UTC (after Neon's auto-delete at 3:59 AM)
    - cron: "5 4 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Delete old development branch (if exists)
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Checking if development branch exists..."

          DEV_BRANCH=$(curl -s "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" | jq -r '.branches[] | select(.name == "development")')

          if [ ! -z "$DEV_BRANCH" ]; then
            DEV_BRANCH_ID=$(echo "$DEV_BRANCH" | jq -r '.id')
            echo "Found existing development branch with ID: $DEV_BRANCH_ID"
            echo "Deleting by ID..."
            
            DELETE_STATUS=$(curl -s -w "%{http_code}" -o /dev/null \
              -X DELETE "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches/$DEV_BRANCH_ID" \
              -H "Authorization: Bearer $NEON_API_KEY")
            
            echo "Delete status: $DELETE_STATUS"
            echo "Waiting 10 seconds for deletion..."
            sleep 10
          else
            echo "No existing development branch found (may have been auto-deleted by Neon)"
          fi

      - name: Get production branch ID
        id: get-main-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Fetching production branch ID from Neon..."
          BRANCHES=$(curl -s -X GET "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          echo "Branches response: $BRANCHES"

          MAIN_BRANCH_ID=$(echo "$BRANCHES" | jq -r '.branches[] | select(.name == "production") | .id' 2>/dev/null | head -1)

          if [ -z "$MAIN_BRANCH_ID" ] || [ "$MAIN_BRANCH_ID" == "null" ]; then
            echo "Error: Could not find production branch ID"
            exit 1
          fi

          echo "main_branch_id=$MAIN_BRANCH_ID" >> $GITHUB_OUTPUT
          echo "✓ Production branch ID found: $MAIN_BRANCH_ID"

      - name: Create new development branch from production
        id: create-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Creating new development branch as copy of production..."
          RESPONSE=$(curl -s -X POST "https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "development",
                "parent_id": "${{ steps.get-main-branch.outputs.main_branch_id }}"
              },
              "endpoints": [
                {
                  "type": "read_write"
                }
              ]
            }')

          echo "Neon API response: $RESPONSE"

          BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branch.id')
          echo "Branch ID: $BRANCH_ID"

          CONNECTION_STRING=$(echo "$RESPONSE" | jq -r '.connection_uris[0].connection_uri' 2>/dev/null)

          if [ -z "$CONNECTION_STRING" ] || [ "$CONNECTION_STRING" == "null" ]; then
            echo "❌ Error: Could not extract connection string from response"
            echo "Full response was: $RESPONSE"
            exit 1
          fi

          echo "connection_string=$CONNECTION_STRING" >> $GITHUB_OUTPUT
          echo "✅ New development branch created with endpoint!"
          echo "Connection string extracted: ${CONNECTION_STRING:0:50}..."

      - name: Update Vercel environment variable (DATABASE_URL)
        run: |
          echo "Updating Vercel DATABASE_URL..."

          # Get all environment variables first
          ENV_RESPONSE=$(curl -s -X GET "https://api.vercel.com/v9/projects/${{ vars.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}")

          echo "Current env vars: $ENV_RESPONSE"

          # Update DATABASE_URL
          curl -s -X PATCH "https://api.vercel.com/v9/projects/${{ vars.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "key": "DATABASE_URL",
              "value": "${{ steps.create-branch.outputs.connection_string }}",
              "target": ["preview", "production"]
            }]' \
            -w "\nStatus: %{http_code}\n"

      - name: Trigger Vercel redeploy
        run: |
          echo "Triggering Vercel redeploy..."
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectId\": \"${{ vars.VERCEL_PROJECT_ID }}\",
              \"source\": \"github\"
            }" \
            -w "\nStatus: %{http_code}\n" || echo "Redeploy request sent (may be processed asynchronously)"

      - name: Notify completion
        if: success()
        run: |
          echo "✅ Development database sync completed successfully!"
          echo "- New development branch created from main (old one auto-deleted by Neon)"
          echo "- Vercel env vars updated"
          echo "- Redeploy triggered"
